<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Saisei: an album cover beside the bars, the song's progress under them.
       Every edge on a whole pixel, for it to stay sharp at 16 px. -->
  <g fill="#2e3436">
    <rect x="1" y="2" width="6" height="6" rx="1.5"/>
    <rect x="8" y="4" width="2" height="4" rx="1"/>
    <rect x="11" y="2" width="2" height="6" rx="1"/>
    <rect x="14" y="5" width="2" height="3" rx="1"/>
    <rect x="1" y="11" width="15" height="2" rx="1" opacity="0.35"/>
    <rect x="1" y="11" width="9" height="2" rx="1"/>
  </g>
</svg>
